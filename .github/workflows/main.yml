name: Build & Push MySQL Image

on:
  workflow_dispatch:

jobs:
  build-push:
    runs-on: [self-hosted, linux, kalyan]

    steps:
    # 1️⃣ Checkout code
    - name: Checkout
      uses: actions/checkout@v4

    # 2️⃣ Install Docker (only if not present - Amazon Linux)
    - name: Install Docker if not exists
      run: |
        if ! command -v docker &> /dev/null; then
          echo "Installing Docker..."
          sudo yum update -y
          sudo amazon-linux-extras install docker -y || sudo yum install docker -y
          sudo service docker start
          sudo usermod -aG docker $USER
        else
          echo "Docker already installed"
        fi

    # 3️⃣ Verify Docker
    - name: Verify Docker
      run: docker --version

    # 4️⃣ Login to Docker Hub
    - name: Docker Login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 5️⃣ Build Image from /db folder
    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/mysql-portfolio:latest ./db

    # 6️⃣ Push Image
    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/mysql-portfolio:latest

    # 7️⃣ Logout (optional good practice)
    - name: Docker Logout
      run: docker logout